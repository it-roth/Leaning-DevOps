apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-dpl
spec:
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: master01
      containers:
      - name: spring-app
        image: 69966/springgradleimg:1.1.1
        ports:
        - containerPort: 8080
        volumeMounts: 
          - name: spring-image-vol
          # path inside your container 
            mountPath: /app/src/main/resources/images
      volumes: 
        - name: spring-image-vol
          hostPath: 
            path: /var/images