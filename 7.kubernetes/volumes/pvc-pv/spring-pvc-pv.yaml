apiVersion: v1
kind: PersistentVolume
metadata:
  name: spring-pv-2
spec:
  capacity:
    storage: 10Gi
  #volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: nfs-sharing
  # mountOptions:
  #   - hard
  #   - nfsvers=4.1
  nfs:
    path: /srv/nfs_shared
    server: 10.148.0.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spring-pvc-2
spec:
  storageClassName: nfs-sharing
  resources:
    requests:
      storage: 10Gi
 # volumeMode: Filesystem
  accessModes:
    - ReadWriteMany

