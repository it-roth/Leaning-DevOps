apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-dpl
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: 69966/springgradleimg:1.1.1
        ports:
        - containerPort: 8080
        volumeMounts: 
          - name: spring-image-vol
            mountPath: /app/src/main/resources/images
      volumes: 
        - name: spring-image-vol
          nfs: 
            server: 10.148.0.2
            path:  /srv/nfs_shared/spring-images