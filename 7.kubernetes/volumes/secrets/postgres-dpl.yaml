apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dpl
  namespace: default
spec:
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
    spec:
      containers:
      - name: postgres-app
        image: postgres
        ports:
        - containerPort: 5432
        env: 
          - name: POSTGRES_DATABASE
            value: studentdb
        envFrom: 
          - configMapRef:
              name: postgres-configmap 
          -  secretRef:
               name: postgres-secret