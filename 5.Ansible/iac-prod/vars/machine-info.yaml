google_project_id: project-76d70acd-06f2-447f-954
user: kk 
adc_path: "/home/kk/.config/gcloud/application_default_credentials.json"
ssh_public_key: /home/kk/.ssh/id_ed25519.pub

# Define machine spec
machine_specs:
# Ram 8Gib , 2vCPUs , ...
  large:
    machine_type: "e2-standard-2"
    zone: "asia-southeast1-c"
    disk_size: 50
    disk_type: "pd-standard" # we have hdd(pd-standard) , ssd( pd-ssd)
  medium:
  # Ram 4Gib, 2vCPUs , 1Core 
    machine_type: "e2-medium"
    zone: "asia-southeast2-a"
    disk_size: 40
    disk_type: "pd-standard"

ubuntu_specs:
  v22:
    image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts"
  v24:
    image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64"


machines_info:
  - name: "master02"
    machine_type: "{{ machine_specs.large.machine_type }}"
    image: "{{ ubuntu_specs.v24.image }}"
    zone: "{{ machine_specs.large.zone }}"
    disk_size: "{{ machine_specs.large.disk_size }}"
    disk_type: "{{ machine_specs.large.disk_type }}"
  - name: "master03"
    machine_type: "{{ machine_specs.large.machine_type }}"
    image: "{{ ubuntu_specs.v24.image }}"
    zone: "{{ machine_specs.large.zone }}"
    disk_size: "{{ machine_specs.large.disk_size }}"
    disk_type: "{{ machine_specs.large.disk_type }}"
  - name: "worker01"
    machine_type: "{{ machine_specs.large.machine_type }}"
    image: "{{ ubuntu_specs.v24.image }}"
    zone: "{{ machine_specs.medium.zone }}"
    disk_size: "{{ machine_specs.large.disk_size }}"
    disk_type: "{{ machine_specs.large.disk_type }}"
  - name: "worker02"
    image: "{{ ubuntu_specs.v24.image }}"
    machine_type: "{{ machine_specs.large.machine_type }}"
    zone: "{{ machine_specs.medium.zone }}"
    disk_size: "{{ machine_specs.large.disk_size }}"
    disk_type: "{{ machine_specs.large.disk_type }}"