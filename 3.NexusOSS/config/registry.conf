
# Configuration docker registry
server {

    server_name registry.anajak-khmer.site;

    # Allow uploads up to 10 GB
    client_max_body_size 10G;

    location / {
        proxy_pass http://localhost:5000/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Recommended for large uploads
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nexus.anajak-khmer.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nexus.anajak-khmer.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = registry.anajak-khmer.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name registry.anajak-khmer.site;
    return 404; # managed by Certbot


}