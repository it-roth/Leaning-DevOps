x-defaults: &defaults
  image: nginx:latest
  networks:
    - demo-network
  ports: 
    - 80
services:
  nginx-1:
    container_name: nginx-1
    <<: *defaults
  nginx-2:
    container_name: nginx-2
    <<: *defaults

  nginx-3: 
    image: nginx:alpine 
    container_name: nginx-test
    ports:
      - 3002:80 
    restart: always 
    volumes:
    # bind mount 
      - "./page/index.html:/usr/share/nginx/html/index.html"
    networks:
      testing-network: 
        ipv4_address: 172.25.0.10 

networks:
  demo-network:
  testing-network:
    driver: bridge
    ipam: 
      config: 
        - subnet: 172.25.0.0/16 